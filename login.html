<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartLens AI – Log In</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">

  <!-- 3D Canvas Background -->
  <canvas id="bg-canvas"></canvas>

  <!-- Navbar (logo + Sign Up only) -->
  <nav id="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-brand">
        <span class="brand-icon">🔍</span>
        <span class="brand-name">SmartLens <span class="gradient-text">AI</span></span>
      </a>
      <div class="nav-actions">
        <a href="register.html" class="btn btn-primary">Sign Up</a>
      </div>
    </div>
  </nav>

  <!-- Auth Card -->
  <main class="auth-main">
    <div class="auth-card glass-card">

      <!-- Brand Icon + Title -->
      <div class="auth-logo">🔍</div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to continue your AI-powered journey</p>

      <!-- Error Message -->
      <div class="form-error" id="loginError" style="display:none;" role="alert">
        <span class="error-icon">⚠️</span>
        <span class="error-text">Invalid email or password. Please try again.</span>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form" novalidate>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input
              type="email"
              id="loginEmail"
              name="email"
              class="form-input"
              placeholder="you@example.com"
              required
              autocomplete="email"
            />
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="loginPassword"
              name="password"
              class="form-input"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            />
            <button
              type="button"
              class="pw-toggle"
              id="toggleLoginPw"
              aria-label="Show/hide password"
            >👁️</button>
          </div>
        </div>

        <!-- Remember Me + Forgot Password -->
        <div class="form-row-inline">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe" name="remember" />
            <span class="checkbox-custom"></span>
            Remember Me
          </label>
          <a href="#" class="forgot-link">Forgot Password?</a>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary full-btn" id="loginBtn">
          <span class="btn-text">Log In</span>
          <span class="btn-spinner spinner" style="display:none;"></span>
        </button>
      </form>

      <!-- OR Divider -->
      <div class="or-divider">
        <span class="or-line"></span>
        <span class="or-text">OR</span>
        <span class="or-line"></span>
      </div>

      <!-- Google Sign In -->
      <button type="button" class="social-btn" id="googleLoginBtn">
        <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          <path fill="none" d="M0 0h48v48H0z"/>
        </svg>
        Continue with Google
      </button>

      <!-- Switch Link -->
      <p class="switch-link">
        Don't have an account?
        <a href="register.html" class="switch-anchor">Register Here</a>
      </p>

    </div>
  </main>

  <!-- Footer -->
  <footer id="footer">
    <div class="footer-container">
      <div class="footer-bottom">
        <p>© 2024 SmartLens AI. All rights reserved.</p>
        <div class="footer-bottom-links">
          <a href="#">Privacy</a>
          <a href="#">Terms</a>
          <a href="#">Support</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/three.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
